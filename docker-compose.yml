# docker compose up --build  →  http://localhost:8080
# ÁBACO is a static site: the image already carries every malla, formula, exercise and template (no database).
services:
  web:
    build:
      context: .
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    image: abaco:1.0.0
    ports:
      - '8080:8080'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
